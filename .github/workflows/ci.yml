name: commitgate-release-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned tooling
        run: |
          python -m pip install "genvm-linter==0.11.0"
          python -m pip install "genlayer-test[sim] @ git+https://github.com/genlayerlabs/genlayer-testing-suite.git@343e3a358f9e235a93b49c60721ce7676585ff07"

      - name: Cache Bradbury-compatible GenVM runner bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-v0.2.12

      - name: Fetch exact Bradbury-compatible GenVM runner bundle
        run: |
          mkdir -p "$HOME/.cache/genvm-linter"
          BUNDLE="$HOME/.cache/genvm-linter/genvm-universal-v0.2.12.tar.xz"
          if [ ! -f "$BUNDLE" ]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.2.12/genvm-universal.tar.xz \
              --output "$BUNDLE"
          fi

      - name: Rebuild deployable source
        run: python tools/make_deployable.py

      - name: Pure, adversarial, contract, and Direct Mode tests
        run: python -m pytest tests -m "not multivalidator" -q

      - name: Targeted mutation gate
        run: python tools/mutation_test.py

      - name: GenVM lint and validation
        run: |
          python -m genvm_linter.cli lint artifacts/commitgate_deployable.py --json
          python -m genvm_linter.cli lint integrations/commitgate_execution_gate.py --json
          python tools/genvm_v03_validate.py artifacts/commitgate_deployable.py
          python tools/genvm_v03_validate.py integrations/commitgate_execution_gate.py

      - name: Five-validator GLSim RPC test
        shell: bash
        run: |
          python tools/glsim_v02.py --port 4011 --validators 5 --max-rotations 3 --seed commitgate-ci --no-browser > /tmp/commitgate-glsim.log 2>&1 &
          GLSIM_PID=$!
          trap 'kill "$GLSIM_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if python -c "import httpx; raise SystemExit(0 if httpx.post('http://127.0.0.1:4011/api', json={'jsonrpc':'2.0','id':1,'method':'gen_syncing','params':[]}).status_code == 200 else 1)"; then break; fi
            sleep 1
          done
          COMMITGATE_GLSIM=1 python -m pytest tests/integration/test_glsim_multivalidator.py -q

      - name: Secret scan and proof consistency
        run: |
          python tools/secret_scan.py
          python tools/proof_check.py
          python tools/source_hash.py --check

      - name: Generated-source and diff hygiene
        run: |
          git diff --check
          git diff --exit-code
